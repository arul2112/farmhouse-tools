<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Murugan Farmhouse — Billing</title>
<link rel="stylesheet" href="style.css?v=5" />
</head>
<body>
  <main class="wrap">
    <header class="head">
      <h1>Murugan Farmhouse</h1>
      <p class="sub">Tap <b>+ Add item</b>, choose the item, then the number of bags.</p>
    </header>

    <section class="card">
      <ul class="lines" id="lines"></ul>
      <p class="empty" id="empty">No items yet.</p>

      <button type="button" class="add" id="add">+ Add item</button>

      <!-- step 1: pick the item, step 2: pick the number -->
      <div class="picker" id="picker" hidden>
        <div class="picker-head">
          <button type="button" class="back" id="back" hidden>‹ Back</button>
          <span id="pickerTitle">Choose the item</span>
          <button type="button" class="close" id="close" aria-label="Close">✕</button>
        </div>
        <div class="items" id="items"></div>
        <div class="nos-step" id="nosStep" hidden>
          <div class="nos-grid" id="nosGrid"></div>
          <label class="rate-edit">Rate ₹
            <input type="number" id="rateInput" min="0" step="0.01" inputmode="decimal">
          </label>
        </div>
      </div>

      <div class="totals">
        <div class="trow"><span>Amount</span><b id="gAmount">₹0.00</b></div>
        <div class="trow"><span>CGST 2.5%</span><b id="gCgst">₹0.00</b></div>
        <div class="trow"><span>SGST 2.5%</span><b id="gSgst">₹0.00</b></div>
        <div class="trow grand"><span>Total</span><b id="gTotal">₹0.00</b></div>
      </div>

      <div class="actions">
        <span class="count" id="counters" title="Double-tap to reset the count">Bills: 0</span>
        <button type="button" id="clear" class="btn">Clear</button>
        <button type="button" id="print" class="btn ghost">Print</button>
        <button type="button" id="next" class="btn primary">Next bill →</button>
      </div>
    </section>

    <p class="note">GST 5% (CGST 2.5% + SGST 2.5%) is added on the amount.</p>
  </main>

  <script src="app.js?v=5"></script>
</body>
</html>
