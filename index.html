<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Cache-Control" content="no-cache" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Murugan Farmhouse — Billing</title>
<link rel="stylesheet" href="style.css?v=16" />
</head>
<body>
  <main class="wrap">
    <header class="head">
      <div class="head-top">
        <h1>Murugan Farmhouse</h1>
        <div class="head-actions">
          <button type="button" id="clear" class="btn">Clear</button>
          <button type="button" id="next" class="btn primary">Next bill →</button>
        </div>
      </div>
      <p class="sub">Tap <b>+ Add item</b>, choose the item, then the number.
        <a href="items.html">Rates ›</a>
        <span class="count" id="counters" title="Double-tap to reset the count">Bills: 0</span></p>
    </header>

    <section class="card">
      <div class="table-scroll">
        <table class="bill">
          <thead>
            <tr>
              <th class="l">Name</th>
              <th class="l">Weight</th>
              <th class="c">Nos</th>
              <th class="r">Rate</th>
              <th class="r">Amount</th>
              <th class="r">CGST</th>
              <th class="r">SGST</th>
              <th class="r">Total</th>
              <th class="cut"></th>
            </tr>
          </thead>
          <tbody id="lines"></tbody>
          <tfoot>
            <tr class="grand">
              <td class="l" colspan="7">Grand Total</td>
              <td class="r" id="gTotal">₹0.00</td>
              <td class="cut"></td>
            </tr>
          </tfoot>
        </table>
      </div>
      <p class="empty" id="empty">No items yet — tap <b>+ Add item</b>.</p>

      <button type="button" class="add" id="add">+ Add item</button>

      <!-- popup: step 1 pick the item, step 2 pick the number -->
      <div class="picker" id="picker" hidden>
        <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
          <div class="picker-head">
            <button type="button" class="back" id="back" hidden>‹ Back</button>
            <span id="pickerTitle">Choose the item</span>
            <button type="button" class="close" id="close" aria-label="Close">✕</button>
          </div>
          <div class="items" id="items"></div>
          <div class="nos-grid" id="nosGrid" hidden></div>
        </div>
      </div>
    </section>

    <p class="note">GST 5% (CGST 2.5% + SGST 2.5%) is added on the amount.
      Slide the bill sideways to see every column.</p>
  </main>

  <script src="items.js?v=16"></script>
  <script src="app.js?v=16"></script>
</body>
</html>
