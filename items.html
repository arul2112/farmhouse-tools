<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Cache-Control" content="no-cache" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rates — Murugan Farmhouse</title>
<link rel="stylesheet" href="style.css?v=10" />
</head>
<body>
  <main class="wrap">
    <header class="head">
      <h1>Rates</h1>
      <p class="sub">Change a rate here — the bill picks it up.
        <a href="index.html">‹ Back to the bill</a></p>
    </header>

    <section class="card">
      <ul class="rate-list" id="rateList"></ul>
      <div class="actions">
        <span class="count" id="saved">Saved automatically</span>
        <button type="button" id="reset" class="btn">Standard rates</button>
        <a href="index.html" class="btn primary" id="done">Done →</a>
      </div>
    </section>

    <p class="note">The standard rate is shown under each box. Rates are kept on
      this phone only.</p>
  </main>

  <script src="items.js?v=10"></script>
  <script src="edit.js?v=10"></script>
</body>
</html>
